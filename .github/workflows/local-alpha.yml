name: Alpha CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  portable:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tools in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: pip==25.1.1 setuptools==80.7.1 wheel==0.45.1 -r requirements-dev.txt
      - name: Full portable gate (55 required commands; no skips)
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -B tools/check.py --output "$RUNNER_TEMP/full55" --deadline "$("$RUNNER_TEMP/build-venv/bin/python" -c 'import time; print(time.time()+1100)')"
      - name: Incremental Ruff, mypy and coverage report
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -B tools/check_quality.py --output "$RUNNER_TEMP/quality-baseline"
      - name: Wheel and sdist install with real CLI and MCP smoke
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/distribution_diagnostics.py
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/gitfile_validation.py
          "$RUNNER_TEMP/build-venv/bin/python" -B tools/check_distribution.py --output "$RUNNER_TEMP/distribution"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/gitfile_validation.py --installed
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/worktree_project.py --python "$RUNNER_TEMP/distribution/wheel/venv/bin/python" --installed
      - name: Expired worker recovery (source and installed wheel)
        run: |
          mkdir "$RUNNER_TEMP/recovery"
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/hostbridge_recovery.py > "$RUNNER_TEMP/recovery/source.stdout" 2> "$RUNNER_TEMP/recovery/source.stderr"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/hostbridge_recovery.py --installed > "$RUNNER_TEMP/recovery/installed.stdout" 2> "$RUNNER_TEMP/recovery/installed.stderr"
      - name: Quality-mode recovery (source and installed wheel)
        run: |
          mkdir "$RUNNER_TEMP/quality-recovery"
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/quality_recovery.py > "$RUNNER_TEMP/quality-recovery/source.stdout" 2> "$RUNNER_TEMP/quality-recovery/source.stderr"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/quality_recovery.py --installed > "$RUNNER_TEMP/quality-recovery/installed.stdout" 2> "$RUNNER_TEMP/quality-recovery/installed.stderr"
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/promotion_commit.py > "$RUNNER_TEMP/quality-recovery/commit-source.stdout" 2> "$RUNNER_TEMP/quality-recovery/commit-source.stderr"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/promotion_commit.py --installed > "$RUNNER_TEMP/quality-recovery/commit-installed.stdout" 2> "$RUNNER_TEMP/quality-recovery/commit-installed.stderr"
      - name: Bounded one-shot host fixture (source and installed wheel)
        run: |
          mkdir "$RUNNER_TEMP/host-supervisor"
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/host_supervisor.py > "$RUNNER_TEMP/host-supervisor/source.stdout" 2> "$RUNNER_TEMP/host-supervisor/source.stderr"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/host_supervisor.py --installed > "$RUNNER_TEMP/host-supervisor/installed.stdout" 2> "$RUNNER_TEMP/host-supervisor/installed.stderr"
      - name: Public redaction and private evidence invariants (source and installed)
        run: |
          mkdir "$RUNNER_TEMP/public-redaction"
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/public_redaction.py > "$RUNNER_TEMP/public-redaction/source.stdout" 2> "$RUNNER_TEMP/public-redaction/source.stderr"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/public_redaction.py --installed > "$RUNNER_TEMP/public-redaction/installed.stdout" 2> "$RUNNER_TEMP/public-redaction/installed.stderr"
      - name: Runner budget and Evolution accounting contracts (source and installed)
        run: |
          mkdir "$RUNNER_TEMP/behavior-contracts"
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/runner_budget_contract.py > "$RUNNER_TEMP/behavior-contracts/runner-source.stdout" 2> "$RUNNER_TEMP/behavior-contracts/runner-source.stderr"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/runner_budget_contract.py --installed > "$RUNNER_TEMP/behavior-contracts/runner-installed.stdout" 2> "$RUNNER_TEMP/behavior-contracts/runner-installed.stderr"
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/evolution_accounting_contract.py > "$RUNNER_TEMP/behavior-contracts/evolution-source.stdout" 2> "$RUNNER_TEMP/behavior-contracts/evolution-source.stderr"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/evolution_accounting_contract.py --installed > "$RUNNER_TEMP/behavior-contracts/evolution-installed.stdout" 2> "$RUNNER_TEMP/behavior-contracts/evolution-installed.stderr"
      - name: Explicit bounded host flow (source and installed fixture)
        run: |
          mkdir "$RUNNER_TEMP/host-flow"
          "$RUNNER_TEMP/build-venv/bin/python" -B tests/packaging/host_flow.py > "$RUNNER_TEMP/host-flow/source.stdout" 2> "$RUNNER_TEMP/host-flow/source.stderr"
          "$RUNNER_TEMP/distribution/wheel/venv/bin/python" -I -B tests/packaging/host_flow.py --installed > "$RUNNER_TEMP/host-flow/installed.stdout" 2> "$RUNNER_TEMP/host-flow/installed.stderr"
      - name: Retain scoped verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.os }}-py311
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/full55/*.json
            ${{ runner.temp }}/full55/*.stdout
            ${{ runner.temp }}/full55/*.stderr
            ${{ runner.temp }}/distribution/*.json
            ${{ runner.temp }}/distribution/*.stdout
            ${{ runner.temp }}/distribution/*.stderr
            ${{ runner.temp }}/recovery/*.stdout
            ${{ runner.temp }}/recovery/*.stderr
            ${{ runner.temp }}/quality-recovery/*.stdout
            ${{ runner.temp }}/quality-recovery/*.stderr
            ${{ runner.temp }}/host-supervisor/*.stdout
            ${{ runner.temp }}/host-supervisor/*.stderr
            ${{ runner.temp }}/quality-baseline/*.json
            ${{ runner.temp }}/quality-baseline/*.stdout
            ${{ runner.temp }}/quality-baseline/*.stderr
            ${{ runner.temp }}/public-redaction/*.stdout
            ${{ runner.temp }}/public-redaction/*.stderr
            ${{ runner.temp }}/behavior-contracts/*.stdout
            ${{ runner.temp }}/behavior-contracts/*.stderr
            ${{ runner.temp }}/host-flow/*.stdout
            ${{ runner.temp }}/host-flow/*.stderr
